[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "WhatIfStarRail"
version = "0.2.0"
description = "WhatIfStarRail / 星铁如果说: a story companion for Honkai: Star Rail / 崩坏：星穹铁道."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WhatIfStarRail contributors" }]
dependencies = [
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "click>=8.1,<8.4",
  "rich>=13.7,<15",
  "streamlit>=1.50,<2",
]

[project.optional-dependencies]
bridge = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
capture = ["mss>=9,<11", "rapidocr-onnxruntime>=1.3,<2", "numpy>=1.24,<3"]
llm = ["openai>=1.109,<3"]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pytest>=7.4,<9",
  "ruff>=0.3,<1",
]

[project.scripts]
whatifstarrail = "astral_agents.cli:app"
astral = "astral_agents.cli:app"

[project.urls]
Repository = "https://github.com/JaspinXu/WhatIfStarRail"
Documentation = "https://github.com/JaspinXu/WhatIfStarRail/blob/main/docs/companion.zh-CN.md"
Issues = "https://github.com/JaspinXu/WhatIfStarRail/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["astral_agents"]
